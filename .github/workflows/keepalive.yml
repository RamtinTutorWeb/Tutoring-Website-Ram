# Supabase pauses free-tier projects after 7 days without database activity, which takes the
# whole API down (contact form, content). GET /content reads site_settings, so a daily call
# keeps the project awake. Set the repo variable API_URL if the backend origin changes.
name: Keep database awake

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /content
        env:
          API_URL: ${{ vars.API_URL || 'https://tutorpro-backend-production.up.railway.app' }}
        run: curl --fail --silent --show-error --max-time 30 -o /dev/null -w "%{http_code}\n" "$API_URL/content"
